# Render Blueprint: one web service serving the API and the React build from a
# single origin, plus a managed Postgres.
#
# Deploy: push this to GitHub, then in Render choose New > Blueprint and point
# it at the repo. Verify the plan names below against Render's current pricing
# page before applying, since those slugs change.

databases:
  - name: quaddle-db
    databaseName: quaddle
    user: quaddle
    plan: basic-256mb

services:
  - type: web
    name: quaddle
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A persistent disk is not offered on the free instance type, and uploaded
    # photos are written to the filesystem, so this has to be a paid plan.
    plan: starter
    healthCheckPath: /api/health

    disk:
      name: uploads
      # Matches UPLOAD_DIR in backend/app/main.py. Without this, every photo a
      # student uploads disappears on the next deploy or restart.
      mountPath: /app/backend/uploads
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quaddle-db
          property: connectionString

      # Generated by Render and never stored in the repo. Left unset, the app
      # would fall back to config.py's "change-me" and sign forgeable tokens.
      - key: SECRET_KEY
        generateValue: true

      - key: PROJECT_NAME
        value: Quaddle

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

      # Empty on purpose: the frontend is same-origin here, so no cross-origin
      # request needs allowing. Add origins only if something external calls it.
      - key: BACKEND_CORS_ORIGINS
        value: "[]"
